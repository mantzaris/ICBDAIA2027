[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-regeneration"
version = "0.1.0"
description = "Reproducible selective waveform inpainting research"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "scipy>=1.7", "scikit-learn>=1.0", "PyYAML>=5.4"]

[project.optional-dependencies]
train = ["torch>=1.10"]
test = ["pytest>=7"]
sources = ["requests>=2.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
